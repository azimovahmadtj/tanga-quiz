<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Танга — таърих ва англисӣ</title>
<meta name="theme-color" content="#1A5CE6">
<meta name="description" content="Омӯзиш, саволҳо, тестҳо ва мукофотҳо дар як ҷо.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/tanga-mark.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Танга">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Rubik:wght@400;500;600&display=swap&subset=cyrillic-ext" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --panel:#FFFFFF; --ink:#141B2E; --muted:#5E6782; --line:#E3E7F0;
  --blue:#1A5CE6; --blue-soft:#DDE8FC; --red:#E0302B; --red-soft:#FDE3E1;
  --green:#1FA35A; --green-soft:#DDF3E5; --violet:#6D4BE0; --violet-soft:#E9E3FC;
  --orange:#F07A12; --gold:#E3A316; --track:#E6EAF2;
  --parch1:#F4E6D4; --parch2:#EAD3B8; --shadow:0 6px 22px rgba(28,45,90,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --panel:#171E33; --ink:#E8ECF6; --muted:#98A2BC; --line:#263050;
  --blue:#6E9BFF; --blue-soft:#1D2C54; --red:#FF6B63; --red-soft:#3D1F22;
  --green:#4FCB85; --green-soft:#16372A; --violet:#A58BFF; --violet-soft:#2A2350;
  --orange:#FF9A45; --gold:#F2BE45; --track:#27314F; --parch1:#3A2E22; --parch2:#2A2119; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0E1322; --panel:#171E33; --ink:#E8ECF6; --muted:#98A2BC; --line:#263050;
  --blue:#6E9BFF; --blue-soft:#1D2C54; --red:#FF6B63; --red-soft:#3D1F22;
  --green:#4FCB85; --green-soft:#16372A; --violet:#A58BFF; --violet-soft:#2A2350;
  --orange:#FF9A45; --gold:#F2BE45; --track:#27314F; --parch1:#3A2E22; --parch2:#2A2119; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Rubik",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:0;line-height:1.15}
.serif{font-family:"Alegreya",Georgia,serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;flex:none}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside.side{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 26px}
.coin{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F9DC7E,#D8960F 70%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 2px 0 #8A5E05;display:grid;place-items:center;font:800 16px "Alegreya",serif;color:#5C3D02}
.logo b{font:800 24px "Alegreya",serif}
.logo-mark{width:42px;height:42px;flex:none;display:block}
nav.menu{display:grid;gap:6px}
nav.menu button{display:flex;align-items:center;gap:14px;border:0;background:none;border-radius:12px;padding:12px 16px;text-align:left;font-size:16px;color:var(--ink)}
nav.menu button:hover{background:var(--bg)}
nav.menu button[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
nav.menu button[data-v="history"][aria-current="page"]{background:var(--red-soft);color:var(--red)}
nav.menu .ico-home{color:var(--blue)} nav.menu .ico-hist{color:var(--red)} nav.menu .ico-en{color:var(--violet)}

.main{padding:18px 26px 40px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;border:0;background:#E7ECF6;border-radius:14px;padding:11px 14px 11px 44px}
:root[data-theme="dark"] .search input{background:var(--panel)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .search input{background:var(--panel)}}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5;padding:6px}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.sres button:hover{background:var(--bg)}
.spacer{flex:1}
.langs{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.langs button{border:0;background:none;padding:8px 13px;font-weight:500;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.bell{position:relative;border:0;background:none;padding:6px}
.bell .dot{position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.ava{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,#4C7DF0,#7B5CE8);color:#fff;font:600 18px "Rubik",sans-serif;display:grid;place-items:center;flex:none}
.ava.lg{width:78px;height:78px;font-size:32px}
.ava{overflow:hidden;padding:0}.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava.sm{width:32px;height:32px;font-size:14px;display:inline-grid;vertical-align:middle;margin-right:10px}
.ava.xl{width:110px;height:110px;font-size:44px}
.who{display:flex;align-items:center;gap:16px;background:var(--bg);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.who b{font-size:18px}
.acctrow{display:flex;gap:10px;flex-wrap:wrap}

.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.col{display:grid;gap:20px;min-width:0}
.card{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:20px 22px}

.hero{position:relative;border-radius:22px;overflow:hidden;min-height:280px;background:linear-gradient(100deg,var(--parch1) 0%,var(--parch2) 60%);display:flex;align-items:center}
.hero img{position:absolute;right:0;top:0;height:100%;width:64%;object-fit:cover;object-position:left center;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 22%);mask-image:linear-gradient(to right,transparent 0,#000 22%)}
.hero .txt{position:relative;padding:28px 26px;max-width:470px}
.hero h1{font:800 50px/1 "Alegreya",serif;color:#1B1A22}
.hero h1 span{display:block;font-size:37px;margin-top:2px}
.hero p{margin:14px 0 20px;font-size:17px;color:#2E2A28;max-width:370px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h1{color:#F6EBDD}:root:not([data-theme="light"]) .hero p{color:#E4D5C3}}
:root[data-theme="dark"] .hero h1{color:#F6EBDD} :root[data-theme="dark"] .hero p{color:#E4D5C3}
.cta{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:14px;padding:13px 22px;background:var(--red);color:#fff;font-size:17px;font-weight:500;box-shadow:0 6px 16px rgba(224,48,43,.3)}
.cta.blue{background:var(--blue);box-shadow:none;justify-content:center;width:100%}

.qzs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.qz{position:relative;overflow:hidden;border-radius:18px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,#1A5CE6,#6D4BE0);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.qz::after{content:"🏆";position:absolute;right:14px;top:8px;font-size:44px;opacity:.25}
.qz h3{font:800 22px/1.15 "Alegreya",serif;padding-right:40px}
.qz .m{font-size:14px;opacity:.9}
.qz .bar{background:rgba(255,255,255,.25);margin:4px 0 2px}.qz .bar i{background:#FFD35C}
.qz button{align-self:flex-start;border:0;border-radius:10px;padding:9px 16px;background:#fff;color:#1A3E9E;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:6px}
.qz button[disabled]{opacity:.7;cursor:default}
.admbtn{display:flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:9px 14px;background:#0E2554;color:#fff;font-weight:500;white-space:nowrap}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 12px}
.sechead h2{font:800 25px "Alegreya",serif}
.link{border:0;background:none;color:var(--blue);font-size:14px;font-weight:500;padding:0}
.tcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tcard{border:0;padding:0;border-radius:18px;overflow:hidden;text-align:left;background:var(--tint);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.tcard .ph{aspect-ratio:2/1.02;background:center/cover no-repeat;display:block}
.tcard .ph.en{background:linear-gradient(135deg,#5B6CF0,#8E5CE6);display:grid;place-items:center;color:#fff;font:800 38px "Alegreya",serif;letter-spacing:.04em}
.tcard .bd{padding:12px 14px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.tcard h3{font-size:16px;font-weight:600}
.tcard small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-top:6px}
.arrow{width:30px;height:30px;border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--acc);flex:none;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tcard:hover .arrow{background:var(--acc);color:#fff}

.week{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.days{display:flex;gap:14px}
.day{display:grid;gap:8px;justify-items:center;font-size:14px;color:var(--ink)}
.dot{width:30px;height:30px;border-radius:50%;background:var(--track);display:grid;place-items:center;color:#fff}
.dot.done{background:var(--green)}
.dot.today{background:var(--orange);box-shadow:0 0 0 4px rgba(240,122,18,.25)}
.dot.todo{background:none;border:2px dashed var(--orange)}
.streak{display:flex;align-items:center;gap:12px}
.streak b{display:block;font-size:17px}
.streak span{color:var(--muted);font-size:14px}

.acts{list-style:none;margin:0;padding:0}
.acts li{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.acts li:last-child{border-bottom:0}
.acts .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.acts .when{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}

.prof{background:linear-gradient(180deg,var(--blue-soft),var(--panel) 70%);padding:18px}
.prof .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.goal{background:var(--panel);border-radius:16px;padding:16px;margin:16px 0 8px;box-shadow:var(--shadow);border:1px solid var(--line)}
.goal h3{font-size:17px;font-weight:600}
.bar{height:12px;background:var(--track);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini div{display:flex;align-items:center;gap:10px;padding:6px}
.mini span{display:block;font-size:13px;color:var(--muted);white-space:nowrap}
.mini b{font-size:20px}
.cont{display:flex;gap:14px;margin:14px 0 18px;align-items:center}
.cont .ph{width:96px;height:96px;border-radius:14px;background:center/cover;flex:none}
.cont h4{margin:0 0 10px;font-size:16px}
.cont small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:14px;padding:14px 6px;text-align:center}
.stat .c svg{width:20px;height:20px}.stat .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;color:#fff}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.sechead h2.t,h2.t{font:600 19px "Rubik",system-ui,sans-serif;display:flex;align-items:center;gap:8px}

/* play */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px;color:var(--muted)}
.timer{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-bottom:20px}
.timer i{display:block;height:100%;background:var(--blue);transition:width .25s linear}
.timer.low i{background:var(--red)}
.qtext{font:700 26px/1.3 "Alegreya",serif;margin:0 0 20px}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:center}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:13px;color:var(--muted);border:1px solid var(--line)}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{background:var(--green-soft);border-color:var(--green)}
.opt.bad{background:var(--red-soft);border-color:var(--red)}
.result{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.plus{color:var(--gold);font-size:18px}
.btn{border:0;border-radius:12px;padding:10px 18px;background:var(--blue);color:#fff;font-weight:500}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--red);color:var(--red);padding:6px 12px;font-size:14px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty h3{color:var(--ink);font:800 24px "Alegreya",serif;margin-bottom:8px}
.pagehead{font:800 30px "Alegreya",serif;margin:0 0 16px}
.note{font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
td{padding:11px 6px;border-bottom:1px solid var(--line)}
td.n{width:40px;color:var(--muted)} td.c{text-align:right;font-weight:600;color:var(--gold);white-space:nowrap}
tr.me td{background:var(--blue-soft)}
form.add{display:grid;gap:14px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;display:grid;gap:8px}
legend{padding:0 6px;font-weight:600}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px}
textarea{min-height:56px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qlist{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.qlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--blue-soft);margin-right:6px;white-space:nowrap}
.review{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.review p{margin:0 0 6px;font-weight:500}
.review .ans{color:var(--green);font-size:14px}
.pbars{display:grid;gap:14px}
.pbars .l{display:flex;justify-content:space-between;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;max-width:90vw;z-index:20}

@media (max-width:1180px){.home{grid-template-columns:1fr}.tcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:10;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
  .logo{display:none}
  nav.menu{display:flex;overflow-x:auto;gap:2px}
  nav.menu button{flex-direction:column;gap:3px;font-size:11px;padding:6px 10px;min-width:68px;text-align:center}
  .main{padding:14px 14px 100px}
  .top{flex-wrap:wrap}.search{order:5;max-width:none;flex-basis:100%}
  .hero{min-height:0;display:block}.hero img{position:relative;width:100%;height:170px;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 70%,transparent)}
  .hero h1{font-size:38px}.hero h1 span{font-size:28px}.hero .txt{padding:6px 20px 22px}
  .row2{grid-template-columns:1fr}.days{gap:8px}
}
@media (prefers-reduced-motion:reduce){.timer i{transition:none}}
/* auth */
body.authmode .app{display:none}
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(380px,560px);background:radial-gradient(120% 90% at 100% 0%,#1C3A7A,#0C1A3C 60%)}
.aleft{position:relative;background:#E9D8BE center right/cover no-repeat;overflow:hidden}
.aleft::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(250,244,234,.95) 0%,rgba(250,244,234,.82) 38%,rgba(250,244,234,.15) 72%,rgba(250,244,234,0) 100%)}
.aleft::after{content:"";position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(to top,rgba(20,14,8,.72),rgba(20,14,8,0))}
.ain{position:relative;z-index:1;padding:64px 56px 40px;display:flex;flex-direction:column;min-height:100%}
.ain h1{font:800 68px/.98 "Alegreya",Georgia,serif;color:#131A33;max-width:560px}
.ain p.lead{font-size:19px;line-height:1.45;color:#1E2436;max-width:430px;margin:18px 0 16px}
.accent{display:flex;gap:4px;margin-bottom:auto}.accent i{height:5px;border-radius:3px;display:block}
.accent i:first-child{width:52px;background:#1A5CE6}.accent i:last-child{width:120px;background:linear-gradient(90deg,#F2B233,rgba(242,178,51,0))}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px;margin-top:36px}
.feat{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:rgba(40,34,28,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);color:#fff}
.feat .fi{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;flex:none}
.feat b{display:block;font-size:17px;font-weight:600}.feat span{font-size:15px;opacity:.88}
.quote{display:flex;gap:20px;align-items:center;margin-top:18px;max-width:470px;padding:16px 22px 16px 12px;border-radius:18px;background:rgba(40,34,28,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);color:#fff}
.quote img{width:118px;height:133px;object-fit:cover;border-radius:12px;flex:none;-webkit-mask-image:linear-gradient(to right,#000 75%,transparent);mask-image:linear-gradient(to right,#000 75%,transparent)}
.quote blockquote{margin:0;font:700 20px/1.3 "Alegreya",Georgia,serif}
.quote cite{display:block;margin-top:10px;font:400 14px "Rubik",sans-serif;font-style:normal;opacity:.8}
.qdots{display:flex;gap:6px;margin-top:12px}.qdots button{width:8px;height:6px;border-radius:3px;border:0;padding:0;background:rgba(255,255,255,.4)}
.qdots button[aria-current="true"]{width:30px;background:#3C7BFF}
.aright{display:flex;align-items:center;justify-content:center;padding:36px 32px}
.aform{width:100%;max-width:500px;background:var(--panel);border-radius:28px;padding:30px 40px 34px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.atop{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.back{display:flex;align-items:center;gap:10px;border:0;background:none;font-size:16px;padding:4px 0}
.langs.pill{border-radius:999px}.langs.pill button{padding:8px 16px}
.aform h1{font:800 40px/1.05 "Alegreya",Georgia,serif}
.aform .sub{font-size:17px;margin:10px 0 22px;color:var(--ink)}
.fld{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--panel);margin-bottom:12px;min-height:52px}
.fld:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.fld svg{flex:none;color:var(--muted)}
.fld input,.fld select{border:0;background:none;outline:none;flex:1;min-width:0;padding:13px 0;font-size:16px}
.fld select{flex:none;width:auto;padding-right:4px;font-weight:500;cursor:pointer}
.fld .sep{width:1px;align-self:stretch;margin:10px 0;background:var(--line)}
.fld small{color:var(--muted);font-size:12px;white-space:nowrap}
.agree{display:flex;gap:12px;align-items:flex-start;margin:6px 0 20px;font-size:15px}
.agree input{width:24px;height:24px;flex:none;accent-color:var(--blue);margin:0}
.agree button{border:0;background:none;padding:0;color:var(--blue);font:inherit}
.submit{width:100%;border:0;border-radius:18px;padding:17px;background:linear-gradient(90deg,#1A5CE6,#2E6BF0);color:#fff;font-size:19px;font-weight:600;display:flex;justify-content:center;align-items:center;gap:12px;box-shadow:0 10px 24px rgba(26,92,230,.35)}
.submit[disabled]{opacity:.55;cursor:not-allowed}
.aerr{color:var(--red);font-size:14px;margin:0 0 12px}
.anote{background:var(--blue-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.alt{text-align:center;margin-top:22px;font-size:16px}.alt button{border:0;background:none;color:var(--blue);font:inherit;font-weight:500;padding:0}
dialog.terms{border:0;border-radius:20px;padding:24px 26px;max-width:520px;background:var(--panel);color:var(--ink)}
dialog.terms::backdrop{background:rgba(10,15,30,.55)}
dialog.terms h2{font:800 26px "Alegreya",serif;margin-bottom:10px}
dialog.terms li{margin-bottom:8px}
@media (max-width:980px){
 .auth{grid-template-columns:minmax(0,1fr)}
 .ain{padding:34px 22px 26px}.ain h1{font-size:46px}.ain p.lead{font-size:16px}
 .aleft::before{background:linear-gradient(90deg,rgba(250,244,234,.93),rgba(250,244,234,.55) 70%,rgba(250,244,234,.2))}
 .feats{gap:10px;margin-top:22px}.feat{padding:10px 12px;gap:10px}.feat .fi{width:40px;height:40px}.feat b{font-size:15px}.feat span{font-size:13px}
 .quote{display:none}
 .aright{display:block;padding:0 12px 24px;margin-top:-18px;position:relative;z-index:2}.aform{width:auto;max-width:none;border-radius:24px;padding:24px 20px 28px;margin:0}
 .aform h1{font-size:34px}
}
@media (max-width:420px){.feats{grid-template-columns:1fr 1fr}.feat{flex-direction:column;align-items:flex-start}}

.gbtn{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;font-weight:500;font-size:16px;margin-bottom:10px}
.gbtn:hover{border-color:var(--blue)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);margin:6px 0 14px;font-size:14px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.eye{border:0;background:none;color:var(--muted);padding:4px;display:grid}
.linkbtn{border:0;background:none;color:var(--blue);padding:0;font:inherit;font-size:14px}
.alogin{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(9,22,55,.72),rgba(9,22,55,.92)),var(--sideimg) center/cover}
.alcard{width:min(440px,100%);background:var(--panel);border-radius:26px;padding:34px 32px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.alcard .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px;color:#E3A316}
.alcard .brand b{display:block;font:800 28px/1 "Alegreya",serif;color:var(--ink)}.alcard .brand span{font-size:13px;color:var(--muted)}
.alcard h1{font:800 32px "Alegreya",serif;margin-bottom:6px}
/* ---------- profile ---------- */
.pf{display:grid;gap:18px}
.pf-hero{position:relative;border-radius:22px;overflow:hidden;background:#0E1B3D center/cover no-repeat;color:#fff;box-shadow:var(--shadow)}
.pf-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,14,30,.92) 0%,rgba(9,14,30,.65) 45%,rgba(9,14,30,.25) 100%)}
.pf-top{position:relative;display:flex;gap:26px;align-items:center;padding:30px 30px 18px;flex-wrap:wrap}
.pf-ava{position:relative;width:150px;height:150px;flex:none;border-radius:50%;padding:5px;background:conic-gradient(#F6C443,#E39A16,#F6C443)}
.pf-ava .ava{width:100%;height:100%;font-size:54px;border:4px solid #0E1B3D;background:#26335A;color:#fff}
.pf-cam{position:absolute;right:4px;bottom:6px;width:42px;height:42px;border-radius:50%;background:#131A2E;border:2px solid #fff;display:grid;place-items:center;cursor:pointer;font-size:18px}
.pf-id{flex:1;min-width:200px}
.pf-id h1{margin:0;font:800 36px/1.1 "Alegreya",serif;color:#fff;overflow-wrap:anywhere}
.pf-id .nk{opacity:.8;margin:4px 0 10px;font-size:17px}
.pf-id .mt{display:flex;gap:6px;align-items:center;opacity:.85;font-size:15px}
.pf-edit{position:absolute;top:18px;right:18px;z-index:1;background:rgba(10,15,30,.75);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 16px;font:600 14px "Rubik",sans-serif;cursor:pointer}
.pf-badges{position:relative;display:grid;grid-template-columns:2fr 1fr;gap:14px;padding:0 30px 26px;max-width:720px;margin-left:auto}
.pf-lvl,.pf-streak{background:rgba(12,18,36,.78);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 18px;display:flex;gap:14px;align-items:center}
.pf-lvl .ic,.pf-streak .ic{font-size:30px;line-height:1}
.pf-lvl b,.pf-streak b{display:block;font:700 22px "Rubik",sans-serif}
.pf-lvl .grow{flex:1}.pf-lvl .xbar{height:8px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:8px}
.pf-lvl .xbar i{display:block;height:100%;background:linear-gradient(90deg,#3C7BFF,#6EA2FF);border-radius:5px}
.pf-lvl .xp{font-size:12px;opacity:.8;text-align:right;margin-top:4px}
.pf-streak span{font-size:13px;opacity:.85}
.pf-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.pf-stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.pf-stat .ic{font-size:28px;line-height:1}.pf-stat b{display:block;font:700 22px "Rubik",sans-serif;color:var(--ink)}.pf-stat span{font-size:13px;color:var(--muted)}
.pf-tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;width:max-content;max-width:100%;overflow-x:auto}
.pf-tabs button{border:0;background:transparent;color:var(--ink);font:500 15px "Rubik",sans-serif;padding:10px 22px;border-radius:10px;cursor:pointer;white-space:nowrap}
.pf-tabs button[aria-selected="true"]{background:var(--red);color:#fff}
.pf-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.pf-grid .col{display:grid;gap:18px}
.pf h2{font:700 20px "Rubik",sans-serif;margin:0 0 14px;color:var(--ink)}
.pf .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}.pf .hd h2{margin:0}.pf .hd{margin-bottom:14px}
.pf .lnk{border:0;background:none;color:var(--blue);font:500 14px "Rubik",sans-serif;cursor:pointer;padding:0}
.pf-rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pf-ring{background:var(--bg);border-radius:14px;padding:14px 8px;text-align:center}
.pf-ring .rw{position:relative;width:84px;height:84px;margin:0 auto 8px}
.pf-ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.pf-ring .th{position:absolute;inset:14px;border-radius:50%;background:#2A3350 center/cover;display:grid;place-items:center;color:#fff;font:800 20px "Alegreya",serif}
.pf-ring .nm{font-size:13px;font-weight:600;color:var(--ink);min-height:32px;display:flex;align-items:center;justify-content:center}
.pf-ring .pc{font:700 17px "Rubik",sans-serif}
.pf-chart svg{width:100%;height:190px;display:block}
.pf-chart .lg{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.pf-ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.pf-a{text-align:center;padding:6px 4px}
.pf-a .hx{width:70px;height:70px;margin:0 auto 8px;display:grid;place-items:center;font-size:30px;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.pf-a.off .hx{background:var(--track)!important;filter:grayscale(1);opacity:.55}
.pf-a b{display:block;font-size:13px;color:var(--ink)}.pf-a span{font-size:12px;color:var(--muted)}
.pf-a .ab{height:5px;border-radius:3px;background:var(--track);margin:6px 8px 0;overflow:hidden}.pf-a .ab i{display:block;height:100%;background:var(--gold)}
.pf-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.pf-list li{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:10px 12px}
.pf-list .th{width:52px;height:40px;border-radius:9px;flex:none;background:#2A3350 center/cover;display:grid;place-items:center;color:#fff;font-weight:800}
.pf-list .ti{flex:1;min-width:0}.pf-list .ti b{display:block;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pf-list .ti span{font-size:13px;color:var(--muted)}
.pf-list .ok{color:var(--green);font-weight:700;font-size:15px}.pf-list .xp{color:var(--gold);font-weight:700;font-size:14px}.pf-list .ago{color:var(--muted);font-size:13px;white-space:nowrap}
.pf-rank li.me{outline:2px solid var(--green);background:var(--green-soft)}
.pf-rank .n{width:28px;text-align:center;font-weight:700;color:var(--ink)}.pf-rank .ava{width:38px;height:38px;flex:none}
.pf-rank .c{color:var(--gold);font-weight:700;white-space:nowrap}
.pf-bars{display:grid;gap:12px}.pf-bars .l{display:flex;justify-content:space-between;font-size:14px;color:var(--ink)}
.pf-bars .bar{height:8px;margin-top:6px}
.pf .empty-s{color:var(--muted);font-size:14px;margin:0}
@media (max-width:1180px){.pf-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.pf-grid{grid-template-columns:1fr}}
@media (max-width:820px){
  .pf-top{padding:22px 18px 14px;gap:16px}.pf-ava{width:108px;height:108px}.pf-ava .ava{font-size:40px}.pf-cam{width:34px;height:34px;font-size:15px}
  .pf-id h1{font-size:28px}.pf-edit{top:12px;right:12px;padding:8px 10px;font-size:0}.pf-edit::before{content:"✏️";font-size:16px}
  .pf-badges{grid-template-columns:1fr 1fr;padding:0 18px 18px;gap:10px}.pf-lvl,.pf-streak{padding:12px}
  .pf-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pf-stat{padding:12px}.pf-stat b{font-size:19px}
  .pf-stat:last-child{grid-column:span 2}
  .pf-tabs{width:100%}.pf-tabs button{flex:1;padding:10px 8px}
}
/* ---------- settings ---------- */
.st{display:grid;gap:18px;max-width:880px}
.st-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow)}
.st-hd{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.st-hd .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.st-hd .ic svg{width:22px;height:22px}
.st-hd h2{margin:0;font:700 19px "Rubik",sans-serif;color:var(--ink)}.st-hd p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.st-f{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.st-in{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);min-height:46px}
.st-in:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.st-in svg{width:18px;height:18px;color:var(--muted);flex:none}
.st-in input,.st-in select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 15px "Rubik",sans-serif;padding:12px 0;outline:none}
.st-in select{appearance:auto;cursor:pointer}.st-in select option{color:#141B2E}
.st-in .crown{font-size:18px}
.flag{width:22px;height:15px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.12);display:inline-block}
.st-save{width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--red);color:#fff;border:0;border-radius:12px;padding:13px 18px;font:600 15px "Rubik",sans-serif;cursor:pointer}
.st-save svg{width:18px;height:18px}
.st-photo{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.st-photo .ava{width:84px;height:84px;font-size:34px}
.st-btns{display:flex;gap:12px;flex-wrap:wrap}
.st-btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:11px 18px;font:600 14px "Rubik",sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.st-btn svg{width:17px;height:17px}.st-btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.st-btn.red{border-color:var(--red);color:var(--red);background:transparent}
.st-err{color:var(--red);font-size:14px;margin:10px 0 0}
@media (max-width:820px){.st-card{padding:16px}.st-btns .st-btn{flex:1;justify-content:center}}
.pf-ava .pf-on{position:absolute;left:10px;bottom:12px;width:22px;height:22px;border-radius:50%;background:#22C55E;border:3px solid #0E1B3D}
.pf-id h1 .crown{font-size:.7em;vertical-align:middle}
.pf-motto{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.pf-motto .ic{font-size:26px}.pf-motto b{display:block;font:700 17px "Alegreya",serif;color:var(--ink)}.pf-motto span{font-size:13px;color:var(--muted)}
@media (max-width:820px){.pf-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.pf-stat{flex-direction:column;align-items:flex-start;gap:6px}.pf-stat:last-child{grid-column:span 2}.pf-stat b{font-size:18px}.pf-stat span{font-size:12px}}
.qimg{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:14px;margin:0 0 18px;background:var(--bg)}
.cart-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.cart-hero img{width:100%;border-radius:14px;display:block}.cart-hero p{font:600 18px/1.45 "Rubik",sans-serif;color:var(--ink);margin:0 0 8px}.cart-hero small{color:var(--muted)}.cart-hero .btn{margin-top:14px}
@media (max-width:820px){.cart-hero{grid-template-columns:1fr}.qimg{max-height:260px}}
</style>

function startTopic(topic){
  if(S.game){clearInterval(S.game.tick);S.game=null}
  if(S.loaded&&!S.error&&(!S.me?.nick||isOut())){S.pending=topic;return showAuth()}
  S.view="play";paintChrome();
  if(!qCount(topic)){S.view="home";paintChrome();return emptyState(t("noQ"),t("noQtext"))}
  S.game={topic,cur:null};S.me=normMe(S.me);S.me.lastTopic=topic;nextQ();window.scrollTo(0,0)}
function nextQ(){
  const g=S.game;clearInterval(g.tick);
  const m=S.me=normMe(S.me);
  let left;
  if(g.quiz){const z=activeQuizzes().find(x=>x.id===g.quiz);if(!z){S.game=null;S.view="home";paintChrome();return emptyState(t("qzClosed"),"")}
    const dn=(m.quizDone||{})[g.quiz]||[];left=z.qids.map(id=>S.questions.find(q=>q.id===id)).filter(q=>q&&!dn.includes(q.id));
    if(!left.length){S.game=null;S.view="home";paintChrome();return emptyState(t("qzOver"),t("qzOverT"))}
    g.cur=left[0];
  }else{
  if(dayUsed(m)>=CFG.dailyLimit){S.game=null;S.view="home";paintChrome();return emptyState(t("limit"),t("limitT"))}
  left=S.questions.filter(q=>q.topic===g.topic&&!m.answered.includes(q.id));
  if(!left.length){S.game=null;S.view="home";paintChrome();return emptyState(t("allDone"),t("allDoneT"))}
  g.cur=left[Math.floor(Math.random()*left.length)];}g.done=false;g.picked=null;g.remain=CFG.seconds;
  g.order=[0,1,2,3].sort(()=>Math.random()-.5);
  renderQuestion();
  g.tick=setInterval(()=>{g.remain--;const bar=document.querySelector(".timer");
    if(bar){bar.querySelector("i").style.width=(g.remain/CFG.seconds*100)+"%";bar.classList.toggle("low",g.remain<=5);$("secs").textContent=g.remain}
    if(g.remain<=0)answer(-1)},1000);
}
function renderQuestion(){
  const g=S.game;if(!g?.cur)return renderHome();const q=g.cur;
  const opts=q.opts?.[lang]||q.opts?.tj||[];
  $("view").innerHTML=`<div class="card" style="max-width:760px">
   <div class="qhead"><span>${esc(topicName(g.topic))} · +${g.bonus||CFG.coinsPerRight} ${esc(t("coins"))}</span><span><span id="secs">${g.remain}</span> ${esc(t("sec"))}</span></div>
   <div class="timer${g.remain<=5?" low":""}"><i style="width:${g.remain/CFG.seconds*100}%"></i></div>
   <p class="qtext">${esc(qLang(q.q))}</p>
   ${typeof q.img==="string"&&/^\/img\/[\w\/.-]+$/.test(q.img)?`<img class="qimg" src="${esc(q.img)}" alt="">`:""}
   <div class="opts">${g.order.map((oi,pos)=>{let cls="";if(g.done){if(oi===q.correct)cls="ok";else if(oi===g.picked)cls="bad"}
     return `<button class="opt ${cls}" data-o="${oi}" ${g.done?"disabled":""}><span class="k">${"ABCD"[pos]}</span><span>${esc(opts[oi])}</span></button>`}).join("")}</div>
   ${g.done?`<div class="result"><div>${esc(g.picked===-1?t("timeout"):g.picked===q.correct?t("right"):t("wrong"))} ${g.picked===q.correct?`<b class="plus">+${g.bonus||CFG.coinsPerRight}</b>`:""}</div>
     <div style="display:flex;gap:8px"><button class="btn ghost" id="bk">${esc(t("back"))}</button><button class="btn" id="nx">${esc(t("next"))}</button></div></div>`:""}
  </div>`;
  $("view").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
  if($("nx"))$("nx").onclick=nextQ;if($("bk"))$("bk").onclick=()=>go("home");
}
// The answer is checked by the server (Cloud Function submitAnswer): the browser never knows the correct option
// before answering, and coins and progress are written only by the server.
async function answer(oi){
  const g=S.game;if(!g||g.done||g.sending)return;g.sending=true;g.picked=oi;clearInterval(g.tick);
  document.querySelectorAll("#view [data-o]").forEach(b=>b.disabled=true);
  try{const r=await FB.call("submitAnswer",{qid:g.cur.id,choice:oi,quizId:g.quiz||null});
    S.me=normMe(r.me);g.cur.correct=r.correct;g.done=true}
  catch(e){const c=String(e?.code||"");g.done=true;g.cur.correct=undefined;
    if(/resource-exhausted/.test(c)&&/daily/.test(e?.message||"")){S.game=null;S.view="home";paintChrome();return emptyState(t("limit"),t("limitT"))}
    if(/failed-precondition/.test(c)&&g.quiz){S.game=null;S.view="home";paintChrome();return emptyState(t("qzClosed"),"")}
    if(!/already-exists/.test(c))toast(/resource-exhausted/.test(c)?t("tooMany"):authErr(e))}
  finally{g.sending=false}
  renderQuestion();paintChrome();
}
// Profile changes (photo, mistakes list). The server accepts at most one write per second, so writes are spaced out.
let saveChain=Promise.resolve(),lastSave=0;
function saveProfile(fields,opts={}){
  if(!S.db||!S.uid)return Promise.resolve();
  const run=async()=>{const wait=lastSave+1100-Date.now();if(wait>0)await new Promise(r=>setTimeout(r,wait));
    try{await FB.writeProfile(S.uid,fields,opts)}catch(e){toast(authErr(e));throw e}finally{lastSave=Date.now()}};
  return saveChain=saveChain.then(run,run)}

async function onPhoto(e){const f=e.target.files?.[0];if(!f)return;

    await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
    const n=160,c=document.createElement("canvas");c.width=c.height=n;const x=c.getContext("2d");
    const m=Math.min(img.naturalWidth,img.naturalHeight);
    x.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,n,n);URL.revokeObjectURL(url);
    S.me.avatar=c.toDataURL("image/jpeg",.82);await saveProfile({avatar:S.me.avatar});toast(t("photoSaved"));render();

async function sendReset(em,e){const bs=document.querySelectorAll("#fgt,#alFgt");bs.forEach(b=>b.disabled=true);
  try{await FB.reset(em,lang);e.textContent=t("resetSent");e.style.color="var(--green)";e.hidden=false;setTimeout(()=>bs.forEach(b=>b.disabled=false),60000)}

function authErr(x){const c=x?.code||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return t("badLogin");
  if(/email-already-in-use/.test(c))return t("emailUsed");
  if(/weak-password/.test(c))return t("passShort");
  if(/invalid-email/.test(c))return t("emailBad");
  if(/too-many-requests/.test(c))return t("tooMany");
  if(/network/.test(c))return t("netErr");
  if(/popup-closed|cancelled-popup/.test(c))return "";
  if(/permission-denied/.test(c)||/insufficient permissions/i.test(x?.message||""))return t("dbDenied");
  return t("err")+" "+(x?.message||c)}

let draftMem={};
function readDraft(){return draftMem}
function saveDraft(){const f=$("aForm");if(!f)return;const d=new FormData(f);draftMem={...draftMem,name:d.get("name"),nick:d.get("nick"),email:d.get("email"),code:d.get("code"),phone:d.get("phone"),agree:!!d.get("agree")}}
function openTerms(){const d=$("terms");
  d.innerHTML=`<h2>${esc(t("termsTitle"))}</h2><ul>${t("termsList").map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div style="text-align:right"><button class="btn" id="tClose">${esc(t("close"))}</button></div>`;
  $("tClose").onclick=()=>d.close();d.showModal()}
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
async function submitAuth(e){e.preventDefault();saveDraft();
  const f=e.target,d=draftMem,err=$("aErr"),fail=m=>{err.textContent=m;err.hidden=!m};
  const name=String(d.name||"").trim(),nick=String(d.nick||"").trim().replace(/^@+/,""),email=String(d.email||"").trim(),digits=String(d.phone||"").replace(/\D/g,"");
  const pw=f.pass?f.pass.value:"",pw2=f.pass2?f.pass2.value:"";
  if(!name||!nick||!email||!digits)return fail(t("fill"));
  if(!NICK_RE.test(nick))return fail(t("nickBad"));
  if(!EMAIL_RE.test(email))return fail(t("emailBad"));
  if(digits.length<7||digits.length>12)return fail(t("phoneBad"));
  if(!S.uid){if(pw.length<6)return fail(t("passShort"));if(pw!==pw2)return fail(t("passMismatch"))}
  if(!d.agree)return fail(t("agreeNeed"));
  const btn=f.querySelector(".submit");btn.disabled=true;err.hidden=true;
  try{const lower=nick.toLowerCase();
    const owner=await FB.nickOwner(lower);
    if(owner&&owner!==S.uid){btn.disabled=false;return fail(t("nickTaken"))}
    S.registering=true;
    if(!S.uid){const cred=await FB.signUp(email,pw);S.uid=cred.user.uid;S.authEmail=email}
    S.me={...normMe(S.uid&&S.me?S.me:null),nick,nickLower:lower};
    S.contact={name,email,phone:d.code+" "+digits,agreedAt:Date.now(),createdAt:S.contact?.createdAt||Date.now(),updatedAt:Date.now()};
    await (S.hadDoc?FB.writeProfile(S.uid,{nick,nickLower:lower},{claimNick:!owner,contact:S.contact}):FB.writeScore(S.uid,S.me,{claimNick:!owner,contact:S.contact}));S.hadDoc=true;lastSave=Date.now();
    S.registering=false;draftMem={};hideAuth();toast(`${t("welcome")}, ${nick}!`);
    if(S.pending){const p=S.pending;S.pending=null;S.view="home";return startTopic(p)}
    S.view="home";render();
  }catch(x){S.registering=false;btn.disabled=false;fail(authErr(x))}}

/* ---------- wiring ---------- */
function setLang(l){lang=l;try{localStorage.setItem("tanga_lang",l)}catch(e){}if(S.view==="play"&&S.game){paintChrome();renderQuestion()}else render()}

$("q").oninput=e=>{const v=e.target.value.trim().toLowerCase(),box=$("sres");
  if(!v){box.hidden=true;return}
  const hits=TOPICS.filter(tp=>LANGS.some(l=>nameIn(tp,l).toLowerCase().includes(v)));
  box.innerHTML=hits.length?hits.map(tp=>`<button data-s="${tp.id}">${esc(topicName(tp.id))} <span class="note">· ${qCount(tp.id)} ${esc(t("qn"))}</span></button>`).join(""):`<div class="note" style="padding:8px 10px">${esc(t("nothing"))}</div>`;
  box.hidden=false;box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{box.hidden=true;e.target.value="";startTopic(b.dataset.s)})};
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("sres").hidden=true});

S.me=normMe(null);render();
const fbReady=new Promise(r=>{if(window.FB)r();else addEventListener("fb-ready",()=>r(),{once:true})});
(async()=>{
  await fbReady;const db=FB.db;S.db=db;
  const soft=()=>{if(!$("auth").hidden||S.view==="play"||["settings","register"].includes(S.view))return paintChrome();render()};
  db.collection("questions").onSnapshot(s=>{S.questions=s.docs.map(d=>{const x={id:d.id,...d.data()};if(x.topic==="history")x.topic="tajik";return x});soft()},()=>{});
  db.collection("scores").where("period","==",period()).onSnapshot(s=>{S.board=s.docs.map(d=>({id:d.id,...d.data()}));soft()},()=>{});
  db.collection("quizzes").onSnapshot(s=>{S.quizzes=s.docs.map(d=>({id:d.id,...d.data()}));soft()},()=>{});
  db.doc("config/topics").onSnapshot(s=>{applyCustom(s.exists?s.data().list:[]);soft()},()=>{});
  db.doc("config/rules").onSnapshot(s=>{applyRules(s.exists?s.data():null);soft()},()=>{});
  db.doc("config/main").onSnapshot(s=>{const d=s.exists?s.data():null;S.prize=d&&d.period===period()?d.prize:null;soft()},()=>{});
  FB.onAuth(async u=>{
    if(S.registering)return;
    if(u&&u.uid===S.uid&&S.me?.nick)return;
    S.uid=u?u.uid:null;S.authEmail=u?.email||"";S.authName=u?.displayName||"";S.contact=null;
    if(S.uid){try{const snap=await db.doc("scores/"+S.uid).get();const d=snap.exists?snap.data():null;S.hadDoc=!!d;S.me=normMe(d)}catch(e){S.me=normMe(null)}
      if(S.me?.nickLower)FB.nickOwner(S.me.nickLower).then(o=>{if(!o)return saveProfile({nick:S.me.nick,nickLower:S.me.nickLower},{claimNick:true}).catch(()=>{});
        if(o!==S.uid){toast(t("nickTaken"));go("settings")}}).catch(()=>{});
      try{const c=await db.doc("contacts/"+S.uid).get();if(c.exists)S.contact=c.data()}catch(e){}}
    else S.me=normMe(null);
    const first=!S.loaded;S.loaded=true;
    if(!S.me?.nick){if(S.game){clearInterval(S.game.tick);S.game=null}S.view="home";showAuth(S.uid?"register":(first?"register":"login"))}
    else if(!$("auth").hidden){hideAuth();toast(`${t("welcome")}, ${S.me.nick}!`);
      if(S.pending){const p=S.pending;S.pending=null;S.view="home";render();return startTopic(p)}S.view="home"}
    render();
  });
})();
